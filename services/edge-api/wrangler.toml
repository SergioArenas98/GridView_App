# GridView edge API - Cloudflare Worker configuration.
#
# The top level is local development (`wrangler dev`) only. Live state differs
# by environment and is recorded in docs/technical/GridView_Environments.md -
# a declaration in this file is not evidence that anything is provisioned:
# - `env.staging` is deployed to Cloudflare (first in Phase 5B, 2026-07-20).
#   The 2026-09-12 staging deployment provisioned both Durable Object bindings
#   declared for it below; no code path in that configuration looks either up.
# - `env.production` is declared only and has never been deployed: no
#   production Worker, KV or Durable Object namespace, R2 bucket, route,
#   domain or secret exists.

name = "gridview-api-dev"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
ENVIRONMENT = "development"

# Provider reservation coordinator (ADR 0021). One Durable Object identity per
# canonical real source (`jolpica`, `openf1`), so pacing is one global budget
# rather than a per-isolate or per-location approximation.
#
# Declared here for every environment. Declaring is not provisioning, and
# provisioning is not use: the staging namespace was provisioned by the
# 2026-09-12 staging deployment, and production has never been deployed. No
# provider adapter exists and no production module constructs the provider
# HTTP client, so nothing looks the binding up. Staging cannot reach a live
# provider because its `PROVIDER_MODE` selects no live provider (committed
# `none` since the season-batch ingest configuration; `mock` before) - not
# because of this binding. Wherever the namespace is absent, the resolver fails
# closed and no provider request is issued.
[[durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# SQLite-backed storage is required for Durable Objects on the Workers Free
# plan, and `exports` is the current supported registration form.
[exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

# Season publication authority (ADR 0025 D1, D12). One Durable Object identity
# per season becomes that season's sole authority for `activeVersion` /
# `previousVersion` and per-key snapshot state, once - and only once - a season
# has been seeded and activated.
#
# DECLARED HERE; PROVISIONED IN STAGING ONLY; SEASON 2026 ACTIVE THERE. This
# entry and the `env.staging` binding below were deployed to staging on
# 2026-09-12, which created the staging namespace. Staging has selected the
# sequencer authority since 2026-09-15 (version `cccdcf11-…`); the season-2026
# seed was committed there that day, and season 2026 was activated on
# 2026-09-16 under `activate:2026` (version `c297d260-…`). The sequencer is
# therefore the authority for season 2026's publication, rollback and public
# reads in staging; every other season stays on the legacy KV pointers.
# Development and production select no authority; production declares no
# binding and has never been deployed.
#
# Deploying a Worker built with the D14-D16 publication guard (ADR 0026)
# changes how staging publishes and rolls back season 2026: every sequenced
# publication and rollback must preserve the active release's classified
# rounds and participation facts, and `prepare` binds that comparison to the
# active release. Such a deployment is cutover-sensitive (staging runbook,
# section 6) and needs its own explicit authorization.
#
# `storage = "sqlite"` is required: the coordinator commits through
# `ctx.storage.transactionSync`, which only SQLite-backed Durable Objects
# provide. The legacy `[[migrations]]` form is deliberately not used - it
# conflicts with `exports`, which is what `ProviderRateLimiter` already uses.
[exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.staging]
name = "gridview-api-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"
# No provider (decision pack 2026-10-07 DP-6(b)). COMMITTED, NOT DEPLOYED:
# live staging still runs `mock` (Stage A version `cc8d9a54-…`). With `none`
# the whole-season sync routes (`POST /internal/admin/sync/full` and the
# others) and the scheduled handler build no provider and fail fast as
# `provider-unavailable`, so they never construct, guard or publish a mock
# candidate. No schedule invokes that handler: the staging triggers below are
# empty. The only way season data reaches staging is the
# guarded season-batch ingest below. Changing this value from the live one is
# cutover-sensitive (staging runbook, section 6).
PROVIDER_MODE = "none"
PUBLIC_BASE_URL = "https://gridview-api-staging.sejuma18.workers.dev"

# Season 2026 cutover phase (ADR 0025 D12) - ACTIVATION PHASE, LIVE IN STAGING
# since 2026-09-16 (version `c297d260-c81b-4110-bdf2-7572e1206af3`). DO NOT
# DEPLOY THIS FILE AS ROUTINE WORK.
#
# The earlier `seed:2026` phase (live from 2026-09-12, and in version
# `cccdcf11-0eb0-44cf-8854-1ceb0eb30e2c` on 2026-09-15) permitted the one seed,
# which was committed on 2026-09-15. `activate:2026` refuses another seed
# (`phase-not-permitted`) and permitted the authenticated activation route,
# through which season 2026 was activated on 2026-09-16: its publication and
# rollback now run through the sequencer, never through the legacy pointers.
# Every deployment that changes this value is cutover-sensitive (staging
# runbook, section 6) and needs its own explicit authorization. The 2026-09-13
# recovery window, the 2026-09-15 seed and the 2026-09-16 activation are
# recorded in that runbook section.
SEASON_PUBLICATION_CUTOVER_CONTROL = "activate:2026"

# Sequencer authority for the season-2026 cutover (ADR 0025 D12) - LIVE IN
# STAGING since 2026-09-15 (version `cccdcf11-…`), and unchanged here.
#
# Every cutover route refuses with `authority-mode-not-sequencer` unless this
# is exactly `sequencer`. It switches no season's authority by itself: a season
# the sequencer reports as `uninitialized` or `seeded` keeps the legacy KV
# pointers for publication, rollback and public reads until its separately
# authorized activation. Season 2026 was activated on 2026-09-16. Publications and public reads ask the
# sequencer for each season's cutover state first, and fail closed if that
# lookup fails. A later deployment that omits or changes this value is
# cutover-sensitive (staging runbook, section 6). Development and production
# do not set it.
SEASON_PUBLICATION_AUTHORITY = "sequencer"

# The one season the guarded season-batch ingest accepts
# (`POST /internal/admin/season/ingest`, decision pack 2026-10-07 PR-4).
# STAGING ONLY; COMMITTED, NOT DEPLOYED. The value must be exactly the
# four-digit season `2026`, which has curated season metadata; anything else
# (`2026 `, `2099`, `abcd`) is refused as `ingest-misconfigured`. Setting it
# admits nothing by itself: the route still needs `ADMIN_TOKEN`, refuses
# outside staging and under a live-provider `PROVIDER_MODE`, needs the
# reachable sequencer above, and needs a bundled attribution record that
# credits Jolpica as `active`. Every admitted batch then publishes through the
# D14-D16 guard and the `prepare` CAS bound to the submission's
# `expectedActiveVersion`. Deploying it and submitting a batch are each
# separately authorized (staging runbook, section 6, "Guarded season-batch
# ingest"). Development and production do not set it.
SEASON_BATCH_INGEST = "2026"

# Bindings are not inherited by named environments, so each one redeclares it.
[[env.staging.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# Staging only, and staging is the only environment ADR 0025 D12's cutover
# sequence is authorized to target. Production deliberately declares no
# season-publication binding at all, so a production deployment cannot reach the
# class even by accident. Declaring the binding does not by itself provision
# the namespace - the 2026-09-12 staging deployment did. Only
# `SEASON_PUBLICATION_AUTHORITY = "sequencer"` makes the Worker look it up;
# while a deployment lacks that value, the composition builds the exact legacy
# `SnapshotPublisher`.
[[env.staging.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

[env.staging.secrets]
required = ["ADMIN_TOKEN"]

[[env.staging.kv_namespaces]]
binding = "GRIDVIEW_DATA"
id = "1d0fb55486a745a1ad12e03d9f04942b"

# No scheduled trigger. COMMITTED, NOT DEPLOYED: live staging still runs the
# nightly `17 3 * * *` (Stage A version `cc8d9a54-…`). Under
# `PROVIDER_MODE = "none"` that run could only record `sync.failed` and
# rewrite the season's failure state every night, so the season-batch ingest
# configuration removes it.
#
# The empty list is deliberate and must stay explicit. Wrangler replaces the
# Worker's schedules on deploy only when `crons` is set: an empty list removes
# every schedule, while an absent key leaves the live one in place. Schedules
# are script settings, not part of a version, so neither this deploy nor a
# later `wrangler rollback` to an earlier version restores
# `17 3 * * *`; restoring it is a separate `wrangler triggers deploy`
# (staging runbook, section 6, "Guarded season-batch ingest").
[env.staging.triggers]
crons = []

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
persist = true
invocation_logs = false

# Declared only; never deployed. No `gridview-api-production` Worker exists on
# the Cloudflare account, so none of the configuration below is live.
[env.production]
name = "gridview-api-production"

[env.production.vars]
ENVIRONMENT = "production"
PROVIDER_MODE = "none"

[[env.production.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"
