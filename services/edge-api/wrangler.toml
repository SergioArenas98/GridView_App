# GridView edge API - Cloudflare Worker configuration.
#
# The top level is local development (`wrangler dev`) only. Live state differs
# by environment and is recorded in docs/technical/GridView_Environments.md -
# a declaration in this file is not evidence that anything is provisioned:
# - `env.staging` is deployed to Cloudflare (first in Phase 5B, 2026-07-20).
#   Read-only check of 2026-11-17: version `1d858d56-…` (2026-11-12, a
#   secret-only version over the code of `027da5d`) runs the automatic-updates
#   runtime over the Jolpica proxy transport, with three Durable Object
#   namespaces (rate limiter, publication sequencer, reconciliation ledger).
#   The identity catalog declared for it below is PROPOSED, NOT PROVISIONED.
# - `env.production` is live: version `f1700b39-…` (2026-11-23, code
#   `9535a04`) serves season 2026, born by genesis and published through the
#   guarded ingest as `pm1-0000000000001-15abf90e`. The section below commits
#   gate AU-7's automatic configuration, NOT DEPLOYED; see the section.
# - `env.e2e` is the isolated demonstration Worker of release gate AU-3,
#   deployed on 2026-10-21. AU-3 passed on it on 2026-11-03, and it is
#   unscheduled. See the section.

name = "gridview-api-dev"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
ENVIRONMENT = "development"

# Provider reservation coordinator (ADR 0021). One Durable Object identity per
# canonical real source (`jolpica`, `openf1`), so pacing is one global budget
# rather than a per-isolate or per-location approximation.
#
# Declared here for every environment. Declaring is not provisioning, and
# provisioning is not use: the staging namespace was provisioned by the
# 2026-09-12 staging deployment. Only the automatic-updates runtime constructs
# the provider HTTP client, which reserves through this binding: the
# demonstration Worker (controlled source, never the network) and staging
# (live as read on 2026-11-17); production builds it once its committed
# automatic configuration (gate AU-7) is deployed. Wherever the namespace is absent, the resolver fails closed and
# no provider request is issued.
[[durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# SQLite-backed storage is required for Durable Objects on the Workers Free
# plan, and `exports` is the current supported registration form.
[exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

# Season publication authority (ADR 0025 D1, D12). One Durable Object identity
# per season becomes that season's sole authority for `activeVersion` /
# `previousVersion` and per-key snapshot state, once - and only once - a season
# has been seeded and activated.
#
# DECLARED HERE; PROVISIONED IN STAGING ONLY; SEASON 2026 ACTIVE THERE. This
# entry and the `env.staging` binding below were deployed to staging on
# 2026-09-12, which created the staging namespace. Staging has selected the
# sequencer authority since 2026-09-15 (version `cccdcf11-…`); the season-2026
# seed was committed there that day, and season 2026 was activated on
# 2026-09-16 under `activate:2026` (version `c297d260-…`). The sequencer is
# therefore the authority for season 2026's publication, rollback and public
# reads in staging; every other season stays on the legacy KV pointers.
# Development selects no authority. Production declares the binding and the
# `sequencer` authority (below); its namespace was created by W3 and season
# 2026 was born there by genesis on 2026-11-23.
#
# Deploying a Worker built with the D14-D16 publication guard (ADR 0026)
# changes how staging publishes and rolls back season 2026: every sequenced
# publication and rollback must preserve the active release's classified
# rounds and participation facts, and `prepare` binds that comparison to the
# active release. Such a deployment is cutover-sensitive (staging runbook,
# section 6) and needs its own explicit authorization.
#
# `storage = "sqlite"` is required: the coordinator commits through
# `ctx.storage.transactionSync`, which only SQLite-backed Durable Objects
# provide. The legacy `[[migrations]]` form is deliberately not used - it
# conflicts with `exports`, which is what `ProviderRateLimiter` already uses.
[exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.staging]
name = "gridview-api-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"
# Automatic updates (ADR 0028; release gate AU-4,
# `docs/release/automatic-updates.md` section 8.3). LIVE IN STAGING: the
# read-only check of 2026-11-17 found `coordinated` in the deployed version
# `1d858d56-…`. The earlier interim value `none` (2026-10-13) let season data
# reach staging only through the guarded season-batch ingest below.
#
# `coordinated` selects the coordinated runtime against the network: staging
# sets no `CONTROLLED_PROVIDER_SOURCE`, so its Jolpica transport is the
# hardened HTTP client behind the global `ProviderRateLimiter`. A run needs the
# reconciliation ledger bound below and sends nothing without it. The guarded
# ingest refuses every batch under this mode (`provider-mode-coordinated`). The
# schedule stays empty (triggers below), so until AU-4 step 3 nothing runs
# unless the operator sends an authenticated `POST /internal/admin/sync/full`.
#
# Deploying this value is AU-4 step 1: cutover-sensitive (staging runbook,
# section 6) and separately authorized. Creating the ledger class there
# permanently blocks `wrangler rollback` to every earlier version (see the
# ledger entry below). Falling back to manual batches is a deploy of
# `PROVIDER_MODE = "none"` that keeps the ledger class and binding.
PROVIDER_MODE = "coordinated"
PUBLIC_BASE_URL = "https://gridview-api-staging.sejuma18.workers.dev"

# Staging only. LIVE as read on 2026-11-17 (deployed 2026-11-12, version
# `1d858d56-…`). The token is a Cloudflare secret, never a plain var.
JOLPICA_TRANSPORT = "proxy"
JOLPICA_PROXY_ORIGIN = "https://gridviewjol.vps.webdock.cloud"

# Season 2026 cutover phase (ADR 0025 D12) - ACTIVATION PHASE, LIVE IN STAGING
# since 2026-09-16 (version `c297d260-c81b-4110-bdf2-7572e1206af3`). DO NOT
# DEPLOY THIS FILE AS ROUTINE WORK.
#
# The earlier `seed:2026` phase (live from 2026-09-12, and in version
# `cccdcf11-0eb0-44cf-8854-1ceb0eb30e2c` on 2026-09-15) permitted the one seed,
# which was committed on 2026-09-15. `activate:2026` refuses another seed
# (`phase-not-permitted`) and permitted the authenticated activation route,
# through which season 2026 was activated on 2026-09-16: its publication and
# rollback now run through the sequencer, never through the legacy pointers.
# Every deployment that changes this value is cutover-sensitive (staging
# runbook, section 6) and needs its own explicit authorization. The 2026-09-13
# recovery window, the 2026-09-15 seed and the 2026-09-16 activation are
# recorded in that runbook section.
SEASON_PUBLICATION_CUTOVER_CONTROL = "activate:2026"

# Sequencer authority for the season-2026 cutover (ADR 0025 D12) - LIVE IN
# STAGING since 2026-09-15 (version `cccdcf11-…`), and unchanged here.
#
# Every cutover route refuses with `authority-mode-not-sequencer` unless this
# is exactly `sequencer`. It switches no season's authority by itself: a season
# the sequencer reports as `uninitialized` or `seeded` keeps the legacy KV
# pointers for publication, rollback and public reads until its separately
# authorized activation. Season 2026 was activated on 2026-09-16. Publications and public reads ask the
# sequencer for each season's cutover state first, and fail closed if that
# lookup fails. A later deployment that omits or changes this value is
# cutover-sensitive (staging runbook, section 6). Development and production
# do not set it.
SEASON_PUBLICATION_AUTHORITY = "sequencer"

# The one season the guarded season-batch ingest accepts
# (`POST /internal/admin/season/ingest`, decision pack 2026-10-07 PR-4).
# STAGING ONLY; LIVE since 2026-10-13 (version `3b3b8273-…`), still set in
# `1d858d56-…` (2026-11-17); two batches have committed through it (2026-10-14 and
# 2026-10-19). The value must be exactly the
# four-digit season `2026`, which has curated season metadata; anything else
# (`2026 `, `2099`, `abcd`) is refused as `ingest-misconfigured`. Setting it
# admits nothing by itself: the route still needs `ADMIN_TOKEN`, refuses
# under `PROVIDER_MODE = "coordinated"` (so it refuses every batch while the
# mode above is committed), needs the reachable sequencer above, and needs a
# bundled attribution record that credits Jolpica as `active` or `automatic`.
# It stays set so that falling back to `none` admits batches again. Every
# admitted batch then publishes through the
# D14-D16 guard and the `prepare` CAS bound to the submission's
# `expectedActiveVersion`. Deploying it and submitting a batch are each
# separately authorized (staging runbook, section 6, "Guarded season-batch
# ingest"). Development and production do not set it.
SEASON_BATCH_INGEST = "2026"

# Identity catalog (ADRs 0029-0031; identity U11). Staging history: G1
# (bundled/off/off) 2026-11-22; P1 (G2 credentials and admin review, G3 R0
# seed, validation and activation) 2026-11-22, staging 59a882a0.
# This commit is the G5 runtime-strict cutover configuration. Deploying it
# needs the owner's live confirmation under U11 amendment A1.
#
# Catalog `runtime`: coordinated runs pin the active staging catalog revision
# and fail closed (`catalog-unavailable`, no provider request, no bundled
# fallback) if the catalog is unbound or unreadable. Discovery `off` builds no
# collector. Admin `read-only` (owner decision D14): individual credentials
# may read the catalog; every identity write is refused
# (`IDENTITY_WRITES_DISABLED`); re-enabling `review` is a separate decision.
# In `read-only` the shared ADMIN_TOKEN reaches only the U2 discovery-health
# compatibility read, never catalog routes. With no valid credentials secret
# the catalog routes answer 503 `CATALOG_UNAVAILABLE`.
# Inventory `optional-drivers` (U11 P3, staging only; owner decision
# 2026-11-22 after catalog R1): a season driver whose exact Jolpica key the
# catalog leaves unmapped no longer ends the participants resource; it is
# accounted for as optional inventory. Race classifications and driver
# standings still require every driver to resolve, so an unmapped driver there
# still blocks that resource and its publication. Runtime authority is a
# precondition (`resolveOperationalInventoryMode`). Staging is the only
# committed environment allowed to name it (inventory-policy acceptance 37);
# production, E2E and development stay strict.
#
# The installation ID is a fresh random UUID v4 proposed on 2026-11-17 for
# staging alone, never derived from `ENVIRONMENT` (E2E shares that value) and
# never to be reused by E2E or production. It binds the catalog object
# `identity:<id>`; a different persisted ID refuses initialization.
IDENTITY_INSTALLATION_ID = "c45d60b8-a723-4b6e-8530-750592af2b94"
IDENTITY_CATALOG_MODE = "runtime"
IDENTITY_DISCOVERY_MODE = "off"
IDENTITY_ADMIN_MODE = "read-only"
IDENTITY_INVENTORY_MODE = "optional-drivers"

# Bindings are not inherited by named environments, so each one redeclares it.
[[env.staging.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# Staging is the only environment ADR 0025 D12's seed-and-activation cutover
# is authorized to target. Production declares its own binding (below) for
# production genesis only, whose `genesis:` phase refuses the seed and the
# activation. Declaring the binding does not by itself provision
# the namespace - the 2026-09-12 staging deployment did. Only
# `SEASON_PUBLICATION_AUTHORITY = "sequencer"` makes the Worker look it up;
# while a deployment lacks that value, the composition builds the exact legacy
# `SnapshotPublisher`.
[[env.staging.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

# The reconciliation ledger (ADR 0020, ADR 0028 D2): the coordinated runtime's
# durable record of what it observed, what is due and what it published.
# LIVE IN STAGING: namespace `f4ebd45f0745433488c0ec90585796dd`, bound in the
# deployed version as read on 2026-11-17.
#
# A named environment's exports table replaces the top-level one, so staging
# restates both top-level classes (unchanged: the namespaces the 2026-09-12
# deployment created keep their identity and storage) and adds the ledger.
#
# IRREVERSIBLE FOR ROLLBACK. The deploy that first ships this class creates a
# third staging namespace. A Durable Object class change blocks
# `wrangler rollback` to every earlier version, permanently, and redeploying
# an older commit also fails, because its staging exports table lacks the
# class (decision pack 2026-10-07). Recovery from then on is only a forward
# deploy from a commit that keeps these three exports: `PROVIDER_MODE =
# "none"` falls back to manual batches, and removing only the binding below
# stops every coordinated run (`ledger-unbound`) while keeping the ledger's
# data. Never remove the exports entry itself: a deleted class is permanent.
[env.staging.exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

[env.staging.exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.staging.exports.ReconciliationLedger]
type = "durable-object"
storage = "sqlite"

[[env.staging.durable_objects.bindings]]
name = "RECONCILIATION_LEDGER"
class_name = "ReconciliationLedger"

# The identity catalog class (identity U11). LIVE IN STAGING since G1
# (2026-11-22, version 13c3a90c): namespace
# `541e9043dfeb4e46aa9362fd198bae5a`, empty until a separately approved seed.
#
# Staging only: production and E2E declare nothing for it, and the top-level
# exports table is unchanged. All three exports above are kept.
#
# IRREVERSIBLE FOR ROLLBACK, like the ledger. The first deploy of this class
# creates a fourth staging namespace and permanently blocks `wrangler rollback`
# to every earlier version (including `1d858d56-…`). Recovery from then on is
# a forward deploy of a commit that keeps all four exports, with the identity
# variables above restored to bundled/off/off. Removing only the binding below
# stops every catalog lookup while keeping the data. Never remove the exports
# entry: a deleted class and its data are gone permanently.
[env.staging.exports.IdentityCatalog]
type = "durable-object"
storage = "sqlite"

[[env.staging.durable_objects.bindings]]
name = "IDENTITY_CATALOG"
class_name = "IdentityCatalog"

# IDENTITY_REVIEWER_CREDENTIALS (U11 G2) is the closed JSON array of
# individual identity credentials: digests, roles and expiry only, never a
# token. It is put before the first deploy that requires it.
[env.staging.secrets]
required = ["ADMIN_TOKEN", "JOLPICA_PROXY_TOKEN", "IDENTITY_REVIEWER_CREDENTIALS"]

[[env.staging.kv_namespaces]]
binding = "GRIDVIEW_DATA"
id = "1d0fb55486a745a1ad12e03d9f04942b"

# No schedule (owner decision 2026-11-23). Staging verified the scheduled
# path for AU-7 with `47 * * * *` on 2026-11-23 (version `b8d7c462`: pin,
# 27 Jolpica requests, heartbeat, no publication), then the schedule was
# removed so that production is the only scheduled user of the Jolpica
# proxy's egress address. A later staging check re-enables it with
# `crons = ["47 * * * *"]` and `wrangler triggers deploy --env staging`,
# never at minute 17, where production runs.
#
# Wrangler replaces the Worker's schedules on deploy only when `crons` is
# set: a list installs exactly these, an empty list removes every schedule,
# and an absent key leaves the live one in place. Schedules are script
# settings, not part of a version, so any `wrangler deploy --env staging` of
# this file installs the schedule, and a `wrangler rollback` does not remove
# it. Stopping it is `crons = []` plus `wrangler triggers deploy --env
# staging`, which changes no code.
[env.staging.triggers]
crons = []

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
persist = true
invocation_logs = false

[env.staging.observability.traces]
enabled = false

# Production (release plan W1-W3; submission path A, Workers Paid). LIVE:
# version `f1700b39-…` (2026-11-23, code `9535a04`, U11 P4). Season 2026 was
# born by genesis and published through the guarded ingest on 2026-11-23 as
# `pm1-0000000000001-15abf90e` (rounds 1-21).
#
# This section commits gate AU-7's automatic configuration
# (`docs/release/automatic-updates.md` section 8.4), NOT DEPLOYED: the
# coordinated runtime against the network through the Jolpica proxy, and the
# hourly schedule. It changes variables, one required secret and the schedule
# only: no class, binding or code. Deploying it needs the owner's live
# confirmation. Under it the guarded ingest refuses every batch
# (`provider-mode-coordinated`).
#
# Recovery, none of which needs a Worker rollback:
# - stop the schedule: `crons = []` plus `wrangler triggers deploy --env
#   production` (no code change; nothing runs or publishes afterwards);
# - fall back to manual batches: deploy `PROVIDER_MODE = "none"` with every
#   class and binding kept; the ingest is admitted again;
# - a bad automatic release: reconciliation hold, then rollback (runbook §6).
#
# Season 2026 is born through production genesis (ADR 0025 D12, "Amendment
# (2026-10-20)"), never through the staging seed and activation:
# - before the authenticated genesis request, the season is `uninitialized`
#   and unknown: its resources answer `404 SEASON_NOT_FOUND` and
#   `/v1/seasons/current` answers `503 SNAPSHOT_NOT_READY` (the new namespace
#   holds nothing);
# - after genesis and before the first reviewed batch commits, the season is
#   `genesis`, still `503 SNAPSHOT_NOT_READY`;
# - only the first batch, submitted with `expectedActiveVersion: null`
#   through the guarded ingest below, makes it `active` and served.
[env.production]
name = "gridview-api-production"
# The API host committed in `config/dart_defines/production.json`.
workers_dev = true
preview_urls = false

[env.production.vars]
ENVIRONMENT = "production"
# Automatic updates (ADR 0028, gate AU-7), as staging since AU-4: the
# coordinated runtime against the network, reading the Jolpica proxy below
# through the hardened HTTP client and the global `ProviderRateLimiter`, and
# recording every observation in the reconciliation ledger bound below. The
# value `none` is the fallback to the guarded ingest.
PROVIDER_MODE = "coordinated"
PUBLIC_BASE_URL = "https://gridview-api-production.sejuma18.workers.dev"
# The Jolpica proxy (staging's since 2026-11-12): an egress address of its
# own, outside Cloudflare's shared Worker addresses. The token is the
# Cloudflare secret `JOLPICA_PROXY_TOKEN`, never a plain var. The proxy holds
# one token, so production carries the same value as staging.
JOLPICA_TRANSPORT = "proxy"
JOLPICA_PROXY_ORIGIN = "https://gridviewjol.vps.webdock.cloud"
# The genesis phase for season 2026. It permits the one authenticated,
# confirmed `POST /internal/admin/publication/cutover/genesis`, refuses the
# staging seed and activation (`phase-not-permitted`), and is the control the
# production ingest requires (`genesis-control-required` otherwise).
SEASON_PUBLICATION_CUTOVER_CONTROL = "genesis:2026"
# Every season reads and publishes through the sequencer once the sequencer
# reports it `genesis` or `active`. Genesis and the ingest refuse otherwise.
SEASON_PUBLICATION_AUTHORITY = "sequencer"
# The one season the guarded ingest accepts, kept so that the fallback to
# `none` admits batches again; under `coordinated` it refuses every batch.
# Every admitted batch still needs
# `ADMIN_TOKEN`, the genesis control above, a sequenced season and a Jolpica
# attribution record marked `active`, and publishes only through the D14-D16
# guard and the `prepare` CAS bound to its `expectedActiveVersion`.
SEASON_BATCH_INGEST = "2026"

# Identity catalog (U11 P4, owner decision 2026-11-22). Production's own
# installation: a fresh random UUID v4, never shared with staging
# (`c45d60b8-…`), E2E or the drill Worker. Its catalog is seeded once from the
# reviewed P0 package (`docs/operations/identity-seed-p0`: R0 plus the
# reviewed Rafael Câmara identity, equal in identity content to staging R1).
# Catalog `runtime`: a guarded batch ingest requires a v2 batch generated from
# the verified production export, the catalog binding and the ledger lease;
# without an active catalog every ingest is refused. Discovery `off`. Admin
# `read-only`: individual credentials may read; every identity write is
# refused (seeding uses a separately reviewed temporary `review` build).
# Inventory `optional-drivers`: a season driver left unmapped by the catalog
# no longer ends the participants resource; race classifications and driver
# standings still require every driver to resolve (inventory-policy
# acceptance 37 allows exactly staging and production).
IDENTITY_INSTALLATION_ID = "98f14de8-d974-423a-bb78-dafe6251164a"
IDENTITY_CATALOG_MODE = "runtime"
IDENTITY_DISCOVERY_MODE = "off"
IDENTITY_ADMIN_MODE = "read-only"
IDENTITY_INVENTORY_MODE = "optional-drivers"

# Bindings are not inherited by named environments, so each one redeclares it.
[[env.production.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# The production season-publication authority (namespace created by W3).
[[env.production.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

# U11 P4: production declares its four classes explicitly (a named
# environment's exports replace the inherited top-level two, which stay).
# P4 (2026-11-23) created the last two namespaces: ReconciliationLedger (the
# season lease a runtime batch ingest takes, and the automatic runtime's
# record under gate AU-7) and IdentityCatalog. Never remove an exports entry:
# a deleted class and its data are gone permanently.
[env.production.exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

[env.production.exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.production.exports.ReconciliationLedger]
type = "durable-object"
storage = "sqlite"

[[env.production.durable_objects.bindings]]
name = "RECONCILIATION_LEDGER"
class_name = "ReconciliationLedger"

[env.production.exports.IdentityCatalog]
type = "durable-object"
storage = "sqlite"

[[env.production.durable_objects.bindings]]
name = "IDENTITY_CATALOG"
class_name = "IdentityCatalog"

# IDENTITY_REVIEWER_CREDENTIALS: production's own closed, digest-only JSON
# array (U5 contract); never committed and never shared with staging.
# JOLPICA_PROXY_TOKEN (gate AU-7) is put before the deploy that requires it.
[env.production.secrets]
required = ["ADMIN_TOKEN", "IDENTITY_REVIEWER_CREDENTIALS", "JOLPICA_PROXY_TOKEN"]

# `gridview-snapshots-production`, created on 2026-10-22 (release plan W2).
# The id is required: Wrangler 4 creates a new namespace on deploy for a KV
# binding without one.
[[env.production.kv_namespaces]]
binding = "GRIDVIEW_DATA"
id = "d76328b37da343db92d927142c072593"

# The hourly schedule of automatic updates (gate AU-7), COMMITTED, NOT
# DEPLOYED; live production answers `[]`. Any `wrangler deploy --env
# production` of this file installs it. The planner decides from the season
# calendar and the ledger what is due; a tick with nothing due sends nothing.
# Stopping it is `crons = []` plus `wrangler triggers deploy --env
# production`.
[env.production.triggers]
crons = ["17 * * * *"]

# Persisted Workers Logs ON for the automatic path's observability (ADR 0028
# D8, which resolves release plan decision D-L). Persisted lines carry no
# personal data and no credential:
# - `invocation_logs = false`: Cloudflare stores none of its own per-request
#   records (request, response and their metadata);
# - the Worker writes no line for a successful public request in production,
#   and a failed one without its request ID (`src/logging/request-log.ts`);
# - what remains is the scheduled automatic runs, the operator's admin
#   requests and failures, in the closed `LogEvent` vocabulary, whose
#   credential keys are redacted wherever they appear.
# So app traffic is not stored, and the Data safety form needs no API row for
# it (PR #82 `data-safety.md` section 3.4, option (b)'s effect). The first
# production deploy confirms it (`docs/release/automatic-updates.md`, gate
# AU-7). Retention is Cloudflare's: 7 days on Workers Paid.
[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
persist = true
invocation_logs = false

# Workers Traces OFF, pinned rather than left to the dashboard default: a
# trace records each request with its metadata, which would persist a record
# per public request and void the logging guarantee above (PR #82
# `data-safety.md` section 3.4). Live since W3 as `enabled: false`.
[env.production.observability.traces]
enabled = false

# The isolated demonstration Worker of release gate AU-3 (ADR 0028 D10;
# `docs/release/automatic-updates.md` section 8.1). DEPLOYED on 2026-10-21
# (AU-2 step 3, version `91ff2541`), with its own three Durable Object
# namespaces and `ADMIN_TOKEN`; season 2026 was born there by genesis (AU-2
# step 4). Its KV namespace, `gridview-snapshots-e2e`, was created on
# 2026-10-21 (AU-2 step 1) and is bound below. AU-3's demonstration ran on it
# and passed on 2026-11-03; its schedule was stopped that night, so it has none.
#
# It is the only environment that reads a controlled provider source; it
# selects the automatic path and binds the reconciliation ledger, as staging
# commits for AU-4. It shares no resource with staging or production:
# - its own Worker name, KV namespace and Durable Object namespaces, so a
#   deploy creates three new ones and leaves staging's two and staging's
#   rollback history untouched;
# - `CONTROLLED_PROVIDER_SOURCE = "kv"`: its Jolpica transport reads the
#   controlled documents loaded into its own KV namespace, never the network;
# - its season 2026 is born through genesis (`genesis:2026`), never through a
#   capture, a submission or the staging seed. The batch ingest is left unset,
#   so it refuses every request as `ingest-disabled`.
# `ENVIRONMENT = "staging"` is what admits the controlled source; production
# can never select it. Deploying it, its `ADMIN_TOKEN`, its genesis, the data
# load and the schedule are each separately authorized (AU-2 steps 3-4, AU-3).
[env.e2e]
name = "gridview-api-e2e"
workers_dev = true
preview_urls = false

[env.e2e.vars]
ENVIRONMENT = "staging"
PROVIDER_MODE = "coordinated"
CONTROLLED_PROVIDER_SOURCE = "kv"
PUBLIC_BASE_URL = "https://gridview-api-e2e.sejuma18.workers.dev"
SEASON_PUBLICATION_AUTHORITY = "sequencer"
SEASON_PUBLICATION_CUTOVER_CONTROL = "genesis:2026"

# A named environment's exports table replaces the top-level one, so it
# restates both top-level classes and adds the ledger.
[env.e2e.exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

[env.e2e.exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.e2e.exports.ReconciliationLedger]
type = "durable-object"
storage = "sqlite"

[[env.e2e.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

[[env.e2e.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

[[env.e2e.durable_objects.bindings]]
name = "RECONCILIATION_LEDGER"
class_name = "ReconciliationLedger"

[[env.e2e.kv_namespaces]]
binding = "GRIDVIEW_DATA"
id = "f8970084eef14b6a8e24db521d015df3"

[env.e2e.secrets]
required = ["ADMIN_TOKEN"]

# Empty: AU-3 passed on 2026-11-03 and its schedule was stopped (runbook §8.2).
# A later run schedules it through its own PR's `triggers deploy`, unmerged
# while it carries the cron.
[env.e2e.triggers]
crons = []

[env.e2e.observability]
enabled = true
head_sampling_rate = 1

[env.e2e.observability.logs]
enabled = true
persist = true
invocation_logs = false
