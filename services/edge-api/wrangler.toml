# GridView edge API - Cloudflare Worker configuration.
#
# The top level is local development (`wrangler dev`) only. Live state differs
# by environment and is recorded in docs/technical/GridView_Environments.md -
# a declaration in this file is not evidence that anything is provisioned:
# - `env.staging` is deployed to Cloudflare (first in Phase 5B, 2026-07-20).
#   The 2026-09-12 staging deployment provisioned both Durable Object bindings
#   declared for it below; no code path in that configuration looks either up.
# - `env.production` is declared only and has never been deployed: no
#   production Worker, KV or Durable Object namespace, R2 bucket, route,
#   domain or secret exists. Its declaration is deliberately incomplete (no
#   KV binding) until the namespace is created; see the section itself.
# - `env.e2e` is the isolated demonstration Worker of release gate AU-3 and
#   has never been deployed: only its KV namespace exists. See the section.

name = "gridview-api-dev"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
ENVIRONMENT = "development"

# Provider reservation coordinator (ADR 0021). One Durable Object identity per
# canonical real source (`jolpica`, `openf1`), so pacing is one global budget
# rather than a per-isolate or per-location approximation.
#
# Declared here for every environment. Declaring is not provisioning, and
# provisioning is not use: the staging namespace was provisioned by the
# 2026-09-12 staging deployment, and production has never been deployed. No
# provider adapter exists and no production module constructs the provider
# HTTP client, so nothing looks the binding up. Staging cannot reach a live
# provider because its `PROVIDER_MODE` selects no live provider (committed
# `none` since the season-batch ingest configuration; `mock` before) - not
# because of this binding. Wherever the namespace is absent, the resolver fails
# closed and no provider request is issued.
[[durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# SQLite-backed storage is required for Durable Objects on the Workers Free
# plan, and `exports` is the current supported registration form.
[exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

# Season publication authority (ADR 0025 D1, D12). One Durable Object identity
# per season becomes that season's sole authority for `activeVersion` /
# `previousVersion` and per-key snapshot state, once - and only once - a season
# has been seeded and activated.
#
# DECLARED HERE; PROVISIONED IN STAGING ONLY; SEASON 2026 ACTIVE THERE. This
# entry and the `env.staging` binding below were deployed to staging on
# 2026-09-12, which created the staging namespace. Staging has selected the
# sequencer authority since 2026-09-15 (version `cccdcf11-…`); the season-2026
# seed was committed there that day, and season 2026 was activated on
# 2026-09-16 under `activate:2026` (version `c297d260-…`). The sequencer is
# therefore the authority for season 2026's publication, rollback and public
# reads in staging; every other season stays on the legacy KV pointers.
# Development selects no authority. Production declares the binding and the
# `sequencer` authority for production genesis (below), but has never been
# deployed, so no production namespace exists.
#
# Deploying a Worker built with the D14-D16 publication guard (ADR 0026)
# changes how staging publishes and rolls back season 2026: every sequenced
# publication and rollback must preserve the active release's classified
# rounds and participation facts, and `prepare` binds that comparison to the
# active release. Such a deployment is cutover-sensitive (staging runbook,
# section 6) and needs its own explicit authorization.
#
# `storage = "sqlite"` is required: the coordinator commits through
# `ctx.storage.transactionSync`, which only SQLite-backed Durable Objects
# provide. The legacy `[[migrations]]` form is deliberately not used - it
# conflicts with `exports`, which is what `ProviderRateLimiter` already uses.
[exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.staging]
name = "gridview-api-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"
# No provider (decision pack 2026-10-07 DP-6(b)). Committed 2026-10-13 and
# LIVE since that day's deployment (version `3b3b8273-…`); the current live
# version `453af4fb-…` (2026-10-19, from `d351118`) keeps it, verified
# read-only on 2026-10-21. This is an interim state, not the operating model:
# automatic updates (an owner release requirement since 2026-10-21) replace
# it with
# the automatic provider mode, a separately authorized change. With `none`
# the whole-season sync routes (`POST /internal/admin/sync/full` and the
# others) and the scheduled handler build no provider and fail fast as
# `provider-unavailable`, so they never construct, guard or publish a mock
# candidate. No schedule invokes that handler: the staging triggers below are
# empty. The only way season data reaches staging is the
# guarded season-batch ingest below. Changing this value from the live one is
# cutover-sensitive (staging runbook, section 6).
PROVIDER_MODE = "none"
PUBLIC_BASE_URL = "https://gridview-api-staging.sejuma18.workers.dev"

# Season 2026 cutover phase (ADR 0025 D12) - ACTIVATION PHASE, LIVE IN STAGING
# since 2026-09-16 (version `c297d260-c81b-4110-bdf2-7572e1206af3`). DO NOT
# DEPLOY THIS FILE AS ROUTINE WORK.
#
# The earlier `seed:2026` phase (live from 2026-09-12, and in version
# `cccdcf11-0eb0-44cf-8854-1ceb0eb30e2c` on 2026-09-15) permitted the one seed,
# which was committed on 2026-09-15. `activate:2026` refuses another seed
# (`phase-not-permitted`) and permitted the authenticated activation route,
# through which season 2026 was activated on 2026-09-16: its publication and
# rollback now run through the sequencer, never through the legacy pointers.
# Every deployment that changes this value is cutover-sensitive (staging
# runbook, section 6) and needs its own explicit authorization. The 2026-09-13
# recovery window, the 2026-09-15 seed and the 2026-09-16 activation are
# recorded in that runbook section.
SEASON_PUBLICATION_CUTOVER_CONTROL = "activate:2026"

# Sequencer authority for the season-2026 cutover (ADR 0025 D12) - LIVE IN
# STAGING since 2026-09-15 (version `cccdcf11-…`), and unchanged here.
#
# Every cutover route refuses with `authority-mode-not-sequencer` unless this
# is exactly `sequencer`. It switches no season's authority by itself: a season
# the sequencer reports as `uninitialized` or `seeded` keeps the legacy KV
# pointers for publication, rollback and public reads until its separately
# authorized activation. Season 2026 was activated on 2026-09-16. Publications and public reads ask the
# sequencer for each season's cutover state first, and fail closed if that
# lookup fails. A later deployment that omits or changes this value is
# cutover-sensitive (staging runbook, section 6). Development and production
# do not set it.
SEASON_PUBLICATION_AUTHORITY = "sequencer"

# The one season the guarded season-batch ingest accepts
# (`POST /internal/admin/season/ingest`, decision pack 2026-10-07 PR-4).
# STAGING ONLY; LIVE since 2026-10-13 (version `3b3b8273-…`), kept by
# `453af4fb-…`; two batches have committed through it (2026-10-14 and
# 2026-10-19). The value must be exactly the
# four-digit season `2026`, which has curated season metadata; anything else
# (`2026 `, `2099`, `abcd`) is refused as `ingest-misconfigured`. Setting it
# admits nothing by itself: the route still needs `ADMIN_TOKEN`, refuses
# outside staging and under a live-provider `PROVIDER_MODE`, needs the
# reachable sequencer above, and needs a bundled attribution record that
# credits Jolpica as `active`. Every admitted batch then publishes through the
# D14-D16 guard and the `prepare` CAS bound to the submission's
# `expectedActiveVersion`. Deploying it and submitting a batch are each
# separately authorized (staging runbook, section 6, "Guarded season-batch
# ingest"). Development and production do not set it.
SEASON_BATCH_INGEST = "2026"

# Bindings are not inherited by named environments, so each one redeclares it.
[[env.staging.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# Staging is the only environment ADR 0025 D12's seed-and-activation cutover
# is authorized to target. Production declares its own binding (below) for
# production genesis only, whose `genesis:` phase refuses the seed and the
# activation. Declaring the binding does not by itself provision
# the namespace - the 2026-09-12 staging deployment did. Only
# `SEASON_PUBLICATION_AUTHORITY = "sequencer"` makes the Worker look it up;
# while a deployment lacks that value, the composition builds the exact legacy
# `SnapshotPublisher`.
[[env.staging.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

[env.staging.secrets]
required = ["ADMIN_TOKEN"]

[[env.staging.kv_namespaces]]
binding = "GRIDVIEW_DATA"
id = "1d0fb55486a745a1ad12e03d9f04942b"

# No scheduled trigger. LIVE since 2026-10-13: that deployment removed the
# nightly `17 3 * * *` the Stage A version had, and the schedules API has
# answered `[]` since (re-read 2026-10-21). Under
# `PROVIDER_MODE = "none"` a nightly run could only record `sync.failed` and
# rewrite the season's failure state every night, so the season-batch ingest
# configuration removes it. The hourly schedule of automatic updates is a
# separate, separately authorized change.
#
# The empty list is deliberate and must stay explicit. Wrangler replaces the
# Worker's schedules on deploy only when `crons` is set: an empty list removes
# every schedule, while an absent key leaves the live one in place. Schedules
# are script settings, not part of a version, so neither this deploy nor a
# later `wrangler rollback` to an earlier version restores
# `17 3 * * *`; restoring it is a separate `wrangler triggers deploy`
# (staging runbook, section 6, "Guarded season-batch ingest").
[env.staging.triggers]
crons = []

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
persist = true
invocation_logs = false

# Production (release plan W1; submission path A, Workers Paid). DECLARED
# ONLY; NEVER DEPLOYED: no `gridview-api-production` Worker, KV or Durable
# Object namespace or secret exists on the Cloudflare account.
#
# INCOMPLETE BY DESIGN - DO NOT DEPLOY. There is deliberately no production
# KV namespace binding: no production namespace exists,
# and Wrangler 4 creates a new namespace on deploy for a KV binding that has
# no `id`. Release plan W2 creates the namespace and the `ADMIN_TOKEN` secret,
# each separately authorized, and commits the real id here. Until then the
# Worker fails closed (`GRIDVIEW_DATA KV binding is required in production`),
# and a first `wrangler deploy` refuses for the missing required secret unless
# one is supplied with `--secrets-file`. Each production deployment (W3) is
# separately authorized.
#
# Season 2026 is born through production genesis (ADR 0025 D12, "Amendment
# (2026-10-20)"), never through the staging seed and activation:
# - before the authenticated genesis request, the season is `uninitialized`
#   and unknown: its resources answer `404 SEASON_NOT_FOUND` and
#   `/v1/seasons/current` answers `503 SNAPSHOT_NOT_READY` (the new namespace
#   holds nothing);
# - after genesis and before the first reviewed batch commits, the season is
#   `genesis`, still `503 SNAPSHOT_NOT_READY`;
# - only the first batch, submitted with `expectedActiveVersion: null`
#   through the guarded ingest below, makes it `active` and served.
[env.production]
name = "gridview-api-production"
# The API host committed in `config/dart_defines/production.json`.
workers_dev = true
preview_urls = false

[env.production.vars]
ENVIRONMENT = "production"
# No provider, as in staging: the whole-season sync routes and the scheduled
# handler build no provider and fail fast as `provider-unavailable`. Season
# data reaches production only through the guarded season-batch ingest.
PROVIDER_MODE = "none"
PUBLIC_BASE_URL = "https://gridview-api-production.sejuma18.workers.dev"
# The genesis phase for season 2026. It permits the one authenticated,
# confirmed `POST /internal/admin/publication/cutover/genesis`, refuses the
# staging seed and activation (`phase-not-permitted`), and is the control the
# production ingest requires (`genesis-control-required` otherwise).
SEASON_PUBLICATION_CUTOVER_CONTROL = "genesis:2026"
# Every season reads and publishes through the sequencer once the sequencer
# reports it `genesis` or `active`. Genesis and the ingest refuse otherwise.
SEASON_PUBLICATION_AUTHORITY = "sequencer"
# The one season the guarded ingest accepts. Every admitted batch still needs
# `ADMIN_TOKEN`, the genesis control above, a sequenced season and a Jolpica
# attribution record marked `active`, and publishes only through the D14-D16
# guard and the `prepare` CAS bound to its `expectedActiveVersion`.
SEASON_BATCH_INGEST = "2026"

# Bindings are not inherited by named environments, so each one redeclares it.
[[env.production.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# The production season-publication authority. Declaring it provisions
# nothing until W3's authorized deploy creates the namespace.
[[env.production.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

[env.production.secrets]
required = ["ADMIN_TOKEN"]

# No scheduled trigger, explicitly: an empty list makes `wrangler deploy` set
# no schedule, where an absent key would leave any existing one in place.
[env.production.triggers]
crons = []

# Persisted Workers Logs ON for the automatic path's observability (ADR 0028
# D8, which resolves release plan decision D-L). Persisted lines carry no
# personal data and no credential:
# - `invocation_logs = false`: Cloudflare stores none of its own per-request
#   records (request, response and their metadata);
# - the Worker writes no line for a successful public request in production,
#   and a failed one without its request ID (`src/logging/request-log.ts`);
# - what remains is the scheduled automatic runs, the operator's admin
#   requests and failures, in the closed `LogEvent` vocabulary, whose
#   credential keys are redacted wherever they appear.
# So app traffic is not stored, and the Data safety form needs no API row for
# it (PR #82 `data-safety.md` section 3.4, option (b)'s effect). The first
# production deploy confirms it (`docs/release/automatic-updates.md`, gate
# AU-7). Retention is Cloudflare's: 7 days on Workers Paid.
[env.production.observability]
enabled = true
head_sampling_rate = 1

[env.production.observability.logs]
enabled = true
persist = true
invocation_logs = false

# The isolated demonstration Worker of release gate AU-3 (ADR 0028 D10;
# `docs/release/automatic-updates.md` section 8.1). DECLARED ONLY; NEVER
# DEPLOYED: no `gridview-api-e2e` Worker, Durable Object namespace, secret or
# schedule exists. Only its KV namespace exists, `gridview-snapshots-e2e`,
# created on 2026-10-21 (AU-2 step 1) and bound below.
#
# It is the only environment that selects the automatic path, binds the
# reconciliation ledger or reads a controlled provider source, and it shares
# no resource with staging or production:
# - its own Worker name, KV namespace and Durable Object namespaces, so a
#   deploy creates three new ones and leaves staging's two and staging's
#   rollback history untouched;
# - `CONTROLLED_PROVIDER_SOURCE = "kv"`: its Jolpica transport reads the
#   controlled documents loaded into its own KV namespace, never the network;
# - its season 2026 is born through genesis (`genesis:2026`), never through a
#   capture, a submission or the staging seed. The batch ingest is left unset,
#   so it refuses every request as `ingest-disabled`.
# `ENVIRONMENT = "staging"` is what admits the controlled source; production
# can never select it. Deploying it, its `ADMIN_TOKEN`, its genesis, the data
# load and the schedule are each separately authorized (AU-2 steps 3-4, AU-3).
[env.e2e]
name = "gridview-api-e2e"
workers_dev = true
preview_urls = false

[env.e2e.vars]
ENVIRONMENT = "staging"
PROVIDER_MODE = "coordinated"
CONTROLLED_PROVIDER_SOURCE = "kv"
PUBLIC_BASE_URL = "https://gridview-api-e2e.sejuma18.workers.dev"
SEASON_PUBLICATION_AUTHORITY = "sequencer"
SEASON_PUBLICATION_CUTOVER_CONTROL = "genesis:2026"

# A named environment's exports table replaces the top-level one, so it
# restates both top-level classes and adds the ledger.
[env.e2e.exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

[env.e2e.exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.e2e.exports.ReconciliationLedger]
type = "durable-object"
storage = "sqlite"

[[env.e2e.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

[[env.e2e.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

[[env.e2e.durable_objects.bindings]]
name = "RECONCILIATION_LEDGER"
class_name = "ReconciliationLedger"

[[env.e2e.kv_namespaces]]
binding = "GRIDVIEW_DATA"
id = "f8970084eef14b6a8e24db521d015df3"

[env.e2e.secrets]
required = ["ADMIN_TOKEN"]

# Empty: AU-3 was paused on 2026-10-22 before its timed checks (runbook §8.2).
# A replay schedules it again through its own PR and `triggers deploy`.
[env.e2e.triggers]
crons = []

[env.e2e.observability]
enabled = true
head_sampling_rate = 1

[env.e2e.observability.logs]
enabled = true
persist = true
invocation_logs = false
