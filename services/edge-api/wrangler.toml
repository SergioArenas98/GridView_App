# GridView edge API - Cloudflare Worker configuration.
#
# The top level is local development (`wrangler dev`) only. Live state differs
# by environment and is recorded in docs/technical/GridView_Environments.md -
# a declaration in this file is not evidence that anything is provisioned:
# - `env.staging` is deployed to Cloudflare (first in Phase 5B, 2026-07-20).
#   The 2026-09-12 staging deployment provisioned both Durable Object bindings
#   declared for it below; no code path in that configuration looks either up.
# - `env.production` is declared only and has never been deployed: no
#   production Worker, KV or Durable Object namespace, R2 bucket, route,
#   domain or secret exists.

name = "gridview-api-dev"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
ENVIRONMENT = "development"

# Provider reservation coordinator (ADR 0021). One Durable Object identity per
# canonical real source (`jolpica`, `openf1`), so pacing is one global budget
# rather than a per-isolate or per-location approximation.
#
# Declared here for every environment. Declaring is not provisioning, and
# provisioning is not use: the staging namespace was provisioned by the
# 2026-09-12 staging deployment, and production has never been deployed. No
# provider adapter exists and no production module constructs the provider
# HTTP client, so nothing looks the binding up. Staging cannot reach a live
# provider because `PROVIDER_MODE = "mock"` and no live adapter exists - not
# because of this binding. Wherever the namespace is absent, the resolver fails
# closed and no provider request is issued.
[[durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# SQLite-backed storage is required for Durable Objects on the Workers Free
# plan, and `exports` is the current supported registration form.
[exports.ProviderRateLimiter]
type = "durable-object"
storage = "sqlite"

# Season publication authority (ADR 0025 D1, D12). One Durable Object identity
# per season becomes that season's sole authority for `activeVersion` /
# `previousVersion` and per-key snapshot state, once - and only once - a season
# has been seeded and activated.
#
# DECLARED HERE; PROVISIONED IN STAGING ONLY; STILL DISABLED. This entry and
# the `env.staging` binding below were deployed to staging on 2026-09-12, which
# created the staging namespace. That is provisioning, not use: no season has
# been seeded or activated, and `SEASON_PUBLICATION_AUTHORITY` is unset in
# every environment here - so no code path looks this binding up and legacy KV
# pointers remain authoritative everywhere. Live staging (version
# `00012c06-…`, 2026-09-12) carries `SEASON_PUBLICATION_CUTOVER_CONTROL =
# "seed:2026"`, so admission for season 2026 is closed there, but authority is
# still disabled. `env.staging` below declares that same value again, as the
# prepared reclosure configuration - read the warning there before deploying
# this file. Production declares no binding and has never been deployed.
#
# `storage = "sqlite"` is required: the coordinator commits through
# `ctx.storage.transactionSync`, which only SQLite-backed Durable Objects
# provide. The legacy `[[migrations]]` form is deliberately not used - it
# conflicts with `exports`, which is what `ProviderRateLimiter` already uses.
[exports.SeasonPublicationSequencer]
type = "durable-object"
storage = "sqlite"

[env.staging]
name = "gridview-api-staging"
workers_dev = true
preview_urls = false

[env.staging.vars]
ENVIRONMENT = "staging"
PROVIDER_MODE = "mock"
PUBLIC_BASE_URL = "https://gridview-api-staging.sejuma18.workers.dev"

# Admission closure for season 2026 (ADR 0025 D12 step 1) - LIVE IN STAGING,
# RESTORED HERE AS THE PREPARED RECLOSURE CONFIGURATION. DO NOT DEPLOY THIS
# FILE AS ROUTINE WORK.
#
# Live staging version `00012c06-6c09-4b2f-b24c-02d6e51ec08d` (2026-09-12)
# carries `SEASON_PUBLICATION_CUTOVER_CONTROL = "seed:2026"` - the
# authenticated operator's explicit season selection - so season 2026's legacy
# publication and rollback admission is closed there.
#
# Season-2026 inventory recovery (prepared 2026-09-13; nothing deployed). None
# of the retained season-2026 versions records an exact `__inventory`, so the
# D12 seed cannot run, and no existing release may be given a reconstructed
# one. The recovery is exactly one new publication under the current code,
# which writes its own inventory. The temporary reopening configuration
# (PR #23) omitted this value so that one separately authorized, time-bounded
# `wrangler deploy --env staging` can reopen admission for that publication.
# This file restores exactly `seed:2026` as the reviewed reclosure: only the
# further authorized deployment that immediately follows that one publication
# may upload it - never before the publication, and never as routine or
# unrelated work - and it must be live before any client reset, checkpoint or
# seed. Merging it changes nothing in Cloudflare. See the staging runbook,
# section 6.
#
# `seed:2026` closes admission and permits only the seed preparation to be
# attempted; it does not itself construct a checkpoint, seed the sequencer or
# touch `SEASON_PUBLICATION_AUTHORITY`, which stays unset, so nothing is seeded
# or activated and legacy KV pointers stay authoritative.
SEASON_PUBLICATION_CUTOVER_CONTROL = "seed:2026"

# Bindings are not inherited by named environments, so each one redeclares it.
[[env.staging.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"

# Staging only, and staging is the only environment ADR 0025 D12's cutover
# sequence is authorized to target. Production deliberately declares no
# season-publication binding at all, so a production deployment cannot reach the
# class even by accident. Declaring the binding does not by itself provision
# the namespace - the 2026-09-12 staging deployment did - and an unset
# `SEASON_PUBLICATION_AUTHORITY` means nothing looks it up: the composition
# builds the exact legacy `SnapshotPublisher` it builds today.
[[env.staging.durable_objects.bindings]]
name = "SEASON_PUBLICATION_SEQUENCER"
class_name = "SeasonPublicationSequencer"

[env.staging.secrets]
required = ["ADMIN_TOKEN"]

[[env.staging.kv_namespaces]]
binding = "GRIDVIEW_DATA"
id = "1d0fb55486a745a1ad12e03d9f04942b"

[env.staging.triggers]
crons = ["17 3 * * *"]

[env.staging.observability]
enabled = true
head_sampling_rate = 1

[env.staging.observability.logs]
enabled = true
persist = true
invocation_logs = false

# Declared only; never deployed. No `gridview-api-production` Worker exists on
# the Cloudflare account, so none of the configuration below is live.
[env.production]
name = "gridview-api-production"

[env.production.vars]
ENVIRONMENT = "production"
PROVIDER_MODE = "none"

[[env.production.durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITER"
class_name = "ProviderRateLimiter"
