name: Automation monitor

# Outside-in alerting for GridView's automatic updates (ADR 0028 D9). It reads
# three public API resources and fails when the coordinated runtime's
# heartbeat is stale or a race result is late, so GitHub notifies the owner of
# the failed run.
#
# SCHEDULED FOR PRODUCTION (release gate AU-7, monitor step): every hour at
# minute 47, thirty minutes after the production Worker's `17 * * * *` tick,
# with the heartbeat check on and no simulated failure. `workflow_dispatch`
# keeps the manual checks for either environment.
#
# Schedules run only from the default branch. GitHub can delay a scheduled
# run, sends a failed scheduled run's e-mail to the user who last changed the
# `cron` line (not to whoever dispatched a run), and disables scheduled
# workflows in a public repository after 60 days without repository activity:
# check the workflow is enabled whenever the monthly Cloudflare invoice
# arrives.
#
# No secret is used, and the job can read nothing a user of the app could not.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Which API to check
        type: choice
        options: [staging, production]
        default: staging
      skip_heartbeat:
        description: Skip the heartbeat check (the environment is not automatic yet)
        type: boolean
        default: false
      simulate_failure:
        description: Fail after the reads, to verify that the alert reaches the owner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: automation-monitor-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/edge-api/scripts/monitor
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the automatic path
        env:
          # A scheduled run has no inputs: production, heartbeat checked, no
          # simulated failure.
          TARGET: ${{ inputs.environment || 'production' }}
          SKIP_HEARTBEAT: ${{ inputs.skip_heartbeat || false }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure || false }}
        run: |
          case "$TARGET" in
            staging) base="https://gridview-api-staging.sejuma18.workers.dev" ;;
            production) base="https://gridview-api-production.sejuma18.workers.dev" ;;
            *) echo "unknown environment" >&2; exit 2 ;;
          esac
          args=(--base-url "$base")
          if [ "$SKIP_HEARTBEAT" = "true" ]; then args+=(--skip-heartbeat); fi
          if [ "$SIMULATE_FAILURE" = "true" ]; then args+=(--simulate-failure); fi
          node services/edge-api/scripts/monitor/automation-monitor.mjs "${args[@]}"
