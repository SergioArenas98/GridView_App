name: CI

on:
  pull_request:
  push:
    branches: [master]

# No private secrets and no production infrastructure are used in CI.
# The Android build is a debug artifact with standard debug signing.

jobs:
  flutter:
    name: Flutter quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code

      - name: Verify generated code is current
        run: |
          dart run build_runner build
          git diff --exit-code

      - name: Verify Drift schema export is current
        run: |
          dart run drift_dev schema dump lib/core/database/gridview_database.dart drift_schemas/
          git diff --exit-code drift_schemas/

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # `flutter test` runs every suite under test/ — the Phase 6B1
      # remote-client, conditional-request, repository, concurrency, persistence
      # and production-isolation tests; the Phase 6B2 bootstrap-repository,
      # resource-key parser, due-resource planner, coordinator, season-transition,
      # provider/lifecycle, startup non-blocking and on-disk orchestration
      # persistence tests; the Phase 7A relevant-event, Calendar state/controller,
      # Grand Prix result state/controller, Calendar and Grand Prix widget,
      # feature offline (on-disk) and result-row component tests; plus the
      # existing migration, widget and golden tests (including the Phase 7A
      # Calendar and Grand Prix goldens).
      # None require a Worker, network, secret or device. The manual staging
      # smoke lives under tool/ (not test/), so it is never run here, and it
      # self-skips without an API_BASE_URL regardless.
      - name: Run tests
        run: flutter test

      - name: Build dev debug APK
        run: flutter build apk --debug --flavor dev --dart-define=APP_ENV=development

      # The Android observability policy asserted against the configured Gradle
      # model: all three Firebase plugins applied, Google Services processing
      # production-only, Crashlytics mapping upload disabled for every variant
      # unless explicitly authorized, and both environment gates wired into each
      # variant's resource merge rather than its pre-build. The APK build above
      # is evidence for one variant on one machine; this is the regression gate
      # for all nine.
      #
      # None of these tasks needs a secret, signing key, device or network beyond
      # the dependency resolution that build already performed, and none of them
      # uploads anything: verifyMappingUploadPolicy tests the pure authorization
      # rule against synthetic input, so the matrix is proven without ever
      # producing the side effect it guards.
      #
      # `gridviewCrashlyticsUploadMapping` is deliberately NOT set here. CI must
      # never authorize a mapping upload; only a future, separately reviewed
      # release job may, and only for its own single step.
      #
      # This must run *after* an Android build, not before: `android/settings.gradle`
      # reads `flutter.sdk` from `android/local.properties`, which is gitignored
      # and absent on a fresh checkout until the Flutter tool writes it. Invoking
      # gradlew any earlier fails on the clean CI runner while passing locally.
      - name: Verify Android build policy
        working-directory: android
        run: >-
          ./gradlew
          :app:verifyAppEnvParser
          :app:verifyMappingUploadPolicy
          :app:verifyAndroidBuildPolicy

  # ---------------------------------------------------------------------------
  # Canonical golden freshness.
  #
  # `flutter test` above compares goldens through a 2% tolerant comparator, which
  # is required so the suite can also run on Windows and macOS developer
  # machines. That tolerance is an *execution* allowance; it is not evidence that
  # the committed baselines are current.
  #
  # Phase 8A proved the difference matters. Commit 07efdd5 changed a visible line
  # break, moving the affected baselines ~1.7% away from what the code renders.
  # That is real visual drift, but it sat under 2%, so every local run stayed
  # green and the staleness went unnoticed for five commits - until ordinary
  # Windows/Linux rendering variance pushed five of those stale baselines past
  # the tolerance in CI.
  #
  # This job separates the two concerns. Linux is the canonical authoring
  # environment, and here the allowance is zero: regenerate every golden and
  # require that not a single committed byte changes.
  #
  # 2% is NOT an error and is not being reduced - it stays exactly as it is for
  # cross-platform execution. What changes is that it is no longer doing double
  # duty as an implicit "the baselines are current" check.
  golden-freshness:
    name: Canonical golden freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The complete set of suites that own a `matchesGoldenFile` assertion,
      # enumerated from the repository rather than globbed, so an unrelated unit
      # test is never re-run here and a new golden suite cannot be silently
      # omitted.
      - name: Regenerate every golden on the canonical platform
        run: |
          flutter test \
            test/design_system/golden_test.dart \
            test/screens/screen_golden_test.dart \
            test/screens/light_theme_golden_test.dart \
            test/settings/settings_golden_test.dart \
            test/media/media_golden_test.dart \
            --update-goldens

      # Explicit directories: CI shells do not enable globstar, so `test/**`
      # would silently match nothing and the gate would pass vacuously.
      - name: Require zero drift in every committed golden
        run: |
          git diff --exit-code -- \
            test/design_system/goldens \
            test/screens/goldens \
            test/settings/goldens \
            test/media/goldens

      # Proves the gate is actually wired to the goldens. Without this, a wrong
      # path or a stale directory list would make the step above pass whatever
      # happened, which is exactly the class of silent failure this job exists to
      # prevent.
      - name: Prove the gate detects a changed golden
        run: |
          set -e
          printf 'drift' >> test/screens/goldens/home_pre_event.png
          if git diff --exit-code -- \
               test/design_system/goldens \
               test/screens/goldens \
               test/settings/goldens \
               test/media/goldens > /dev/null 2>&1; then
            echo "::error::the freshness gate did not detect a modified golden"
            exit 1
          fi
          echo "gate correctly reported the modified golden"
          git checkout -- \
            test/design_system/goldens \
            test/screens/goldens \
            test/settings/goldens \
            test/media/goldens
          git diff --exit-code -- \
            test/design_system/goldens \
            test/screens/goldens \
            test/settings/goldens \
            test/media/goldens
          echo "repository restored and clean"

  edge-api:
    name: Edge API quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/edge-api/package-lock.json

      # `node-version: 22` pins Node but says nothing about npm, and the npm
      # bundled with Node 22 has moved 10.9.4 -> 10.9.7 -> 10.9.8 across its
      # patch releases. So the resolver that installs this lockfile drifted
      # silently with the runner image, and nothing in the repository recorded
      # which resolver the lockfile was written for.
      #
      # That gap already broke master once. The Phase 8B lockfile was
      # regenerated under npm 11 on Windows while CI installed it under npm 10
      # on Linux; npm 11 re-nested @emnapi/core and @emnapi/runtime under
      # @rolldown/binding-wasm32-wasi, @img/sharp-wasm32 declares
      # @emnapi/runtime, and `npm ci` failed on Linux with
      # "Missing: @emnapi/runtime@1.11.3 from lock file" before any other Edge
      # gate could run (repaired in f2183ba). `npm ci` succeeds on Windows with
      # that same broken lock, so local verification cannot catch it - only a
      # pinned, stated resolver can.
      #
      # 10.9.9 was the latest published npm 10 release when this pin was
      # established on 2026-08-13, and it is the exact version that authored the
      # committed lockfile - so the resolver that writes the lock and the one
      # that installs it are now the same and cannot drift apart again.
      #
      # This must replace the npm on PATH. A `packageManager` or `engines.npm`
      # field is descriptive only - npm does not enforce either - and `engines`
      # would additionally be recorded in package-lock.json, forcing a lockfile
      # regeneration this change deliberately avoids.
      - name: Pin npm to the version this lockfile was resolved under
        run: npm install --global npm@10.9.9

      - name: Assert the pinned toolchain before installing
        run: |
          set -e
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          echo "node ${node_version}"
          echo "npm  ${npm_version}"
          if [ "${npm_version}" != "10.9.9" ]; then
            echo "::error::expected npm 10.9.9 on PATH, found ${npm_version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Run tests
        run: npm test

      - name: Validate contract, content, fixtures and Worker config
        run: npm run validate

      # The media publication pipeline, end to end, with nothing secret.
      #
      # This runs rights validation, image processing and manifest generation
      # against the real production register - which is authoritative and empty,
      # so the expected result is an empty inventory. That is the point: the gate
      # fails closed, and CI proves it stays closed rather than proving an upload
      # works.
      #
      # No R2 credential, no Cloudflare API token, no bucket, no media URL and no
      # third-party image is involved, and no upload path is reachable from here:
      # the CLI refuses anything but `dry-run`.
      - name: Media publication dry-run
        run: npm run media:dry-run

      # A dry-run must produce a manifest and an inventory even when there is
      # nothing approved, and must never invent an asset.
      - name: Verify the dry-run produced an empty, valid inventory
        run: |
          set -e
          node -e "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('.media-out/media-manifest.json', 'utf8'));
            const objects = JSON.parse(fs.readFileSync('.media-out/object-inventory.json', 'utf8'));
            if (!Array.isArray(manifest.assets) || !Array.isArray(objects)) {
              throw new Error('dry-run output is not the expected shape');
            }
            if (manifest.assets.length !== 0 || objects.length !== 0) {
              throw new Error(
                'The approved media inventory is expected to be empty. If real rights now exist, update this gate deliberately.'
              );
            }
            console.log('dry-run produced an empty inventory, as expected');
          "

      # The dry-run writes only to its ignored output directory.
      - name: Require the dry-run to leave the repository unchanged
        run: git diff --exit-code

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
