name: AU-3 e2e observer (temporary)

# TEMPORARY, for gate AU-3's asynchronous demonstration
# (docs/release/automatic-updates.md section 8.2). Nobody watches the phases
# live, so this observer keeps a timestamped record of what the public API
# served: the real automation monitor against the e2e host, and the e2e host's
# public answers, each run kept as an artifact for 90 days. It reads only
# public resources of the isolated e2e Worker, with no secret; it is not the
# AU-5 monitor schedule, which stays unchanged in `automation-monitor.yml`.
#
# Merging this file is what activates it, so the runbook places the merge after
# the e2e Worker is scheduled. Remove it in the pull request that unschedules
# the e2e Worker: nothing else stops it, and once the Worker stops every run
# fails on a stale heartbeat.
#
# Known limits that affect what the record proves:
# - GitHub may start a scheduled run late, or drop it, under load. A missing
#   run is a gap in the record and does not fail the demonstration; the next
#   run reads the same published data.
# - Scheduled workflows only run from the default branch, so nothing runs
#   until this file is merged.
# - A monitor finding fails the run, so GitHub e-mails the owner. The runbook
#   lists the findings the demonstration expects.

on:
  schedule:
    # Hourly, between the e2e Worker's :17 ticks. `workflow_dispatch` takes one
    # extra observation on request.
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: it would cancel a queued run, and a late run is still
# an observation.

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First, so the artifact exists and dates the run even if a later step
      # fails before the observer writes anything. Outside the workspace,
      # which checkout empties.
      - name: Record the runner's start
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/observation"
          printf '{"runnerStartedAt":"%s","event":"%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" "$EVENT" \
            > "$RUNNER_TEMP/observation/runner.json"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/edge-api/scripts/monitor
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe the e2e host
        # Worst case: the monitor's 3 reads x 2 attempts and the 10 captures,
        # each bounded at 15 s, are 4 minutes.
        timeout-minutes: 6
        run: node services/edge-api/scripts/monitor/au3-e2e-observer.mjs --out "$RUNNER_TEMP/observation"
      - name: Keep the observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: au3-e2e-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation
          if-no-files-found: error
          retention-days: 90
