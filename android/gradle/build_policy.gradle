// Repository-owned, CI-executable verification of the Android build policy.
//
// Manual `flutter build` runs are evidence, not a regression gate. These tasks
// read the configured Gradle model — applied plugins, registered tasks, task
// enablement, task dependencies and resolved module identities — so a future
// edit that quietly reopens one of the holes this phase closed fails here.
//
// Nothing needs a secret, a signing key, a device or network access beyond the
// dependency resolution a normal build already performs.

/// Exercises the Dart-define parser against synthetic inputs.
///
/// Deterministic and hermetic: it never reads the real `dart-defines` property,
/// so it behaves identically in CI and locally, and it covers the cases a real
/// build cannot conveniently produce (duplicates, malformed Base64).
tasks.register('verifyAppEnvParser') {
    group = 'verification'
    description = 'Unit-tests the APP_ENV dart-define parser.'

    doLast {
        // Closures rather than methods: Groovy does not permit a method
        // declaration inside a closure body, which is what a doLast block is.
        def resolveAppEnv = project.ext.resolveAppEnv
        def decodeDartDefines = project.ext.decodeDartDefines

        def encode = { String plain ->
            plain.getBytes('UTF-8').encodeBase64().toString()
        }
        def defines = { List<String> pairs ->
            pairs.collect { encode(it) }.join(',')
        }
        def expectFailure = { String description, Closure body ->
            try {
                body()
            } catch (GradleException ignored) {
                logger.lifecycle("  ok  ${description}")
                return
            }
            throw new GradleException("APP_ENV parser: expected a failure for ${description}")
        }

        // --- the exhaustive flavor x APP_ENV matrix -------------------------
        //
        // Driven from the build's own `requiredAppEnvForFlavor`, so the matrix
        // can never describe a contract the build does not actually enforce.
        // Every declared product flavor is crossed with every declared
        // environment: the diagonal must be accepted and every off-diagonal
        // pairing must be rejected. Adding a flavor grows the matrix by itself.
        Map<String, String> contract = project.ext.requiredAppEnvForFlavor
        List<String> flavors = project.android.productFlavors.collect { it.name }.sort()
        List<String> environments = contract.values().toList().unique().sort()

        assert contract.keySet().sort() == flavors,
            "requiredAppEnvForFlavor covers ${contract.keySet().sort()} " +
            "but the build declares product flavors ${flavors}"
        logger.lifecycle("  ok  every declared product flavor has a declared APP_ENV ${flavors}")

        int accepted = 0
        int rejected = 0
        flavors.each { String flavor ->
            String expected = contract[flavor]
            environments.each { String supplied ->
                String raw = defines(["APP_ENV=${supplied}".toString()])
                if (supplied == expected) {
                    assert resolveAppEnv(raw, flavor, expected) == expected
                    accepted++
                    logger.lifecycle("  ok  ${flavor} + ${supplied} is accepted")
                } else {
                    expectFailure("${flavor} + ${supplied} is rejected") {
                        resolveAppEnv(raw, flavor, expected)
                    }
                    rejected++
                }
            }
        }
        int combinations = flavors.size() * environments.size()
        assert accepted == flavors.size()
        assert accepted + rejected == combinations
        logger.lifecycle(
            "  ok  matrix complete: ${combinations} combinations, " +
            "${accepted} accepted, ${rejected} rejected")

        // --- padded and altered tokens are rejected, for every flavor --------
        //
        // The comparison must be byte-for-byte identical to Dart's. Dart matches
        // the compile-time string exactly and falls back to `development` for
        // anything else, so a gate that normalized before comparing would accept
        // a value Dart rejects — producing an artifact whose flavor and Dart
        // environment disagree, which is exactly what this gate exists to stop.
        int paddedRejected = 0
        flavors.each { String flavor ->
            String expected = contract[flavor]
            Map<String, String> altered = [
                'a leading space'        : ' ' + expected,
                'a trailing space'       : expected + ' ',
                'spaces on both sides'   : ' ' + expected + ' ',
                'a leading tab'          : '\t' + expected,
                'a trailing tab'         : expected + '\t',
                'a leading newline'      : '\n' + expected,
                'a trailing newline'     : expected + '\n',
                'CRLF padding'           : '\r\n' + expected + '\r\n',
                'upper-case'             : expected.toUpperCase(),
                'capitalised'            : expected.capitalize(),
            ]
            altered.each { String description, String value ->
                expectFailure("${flavor} + ${description}") {
                    resolveAppEnv(defines(["APP_ENV=${value}".toString()]), flavor, expected)
                }
                paddedRejected++
            }
        }
        logger.lifecycle(
            "  ok  ${paddedRejected} padded/altered tokens rejected across " +
            "${flavors.size()} flavors")

        // The combination that made this a P1 rather than a nuisance: a padded
        // production token *plus* a fixture data source. Without exact
        // comparison the build would pass here, Dart would resolve to
        // development, and a production-application-ID artifact could serve
        // fixtures. It must fail on APP_ENV, before anything is produced.
        expectFailure('a padded production token beside DATA_SOURCE=fixture') {
            resolveAppEnv(
                defines(['APP_ENV= production ', 'DATA_SOURCE=fixture']),
                'production', 'production')
        }

        // --- other accepted input -------------------------------------------
        assert resolveAppEnv(
            defines(['APP_ENV=production', 'DATA_SOURCE=remote']),
            'production', 'production') == 'production'
        logger.lifecycle('  ok  an unrelated define alongside APP_ENV is accepted')

        // A value containing '=' must survive: the split is at the first '='.
        Map<String, List<String>> withEquals = decodeDartDefines(
            defines(['APP_ENV=production', 'OTHER=a=b=c']))
        assert withEquals['OTHER'] == ['a=b=c']
        assert withEquals['APP_ENV'] == ['production']
        assert resolveAppEnv(
            defines(['APP_ENV=production', 'OTHER=a=b=c']),
            'production', 'production') == 'production'
        logger.lifecycle('  ok  an unrelated define containing "=" is preserved and ignored')

        // A value containing a comma is safe because the outer split is over
        // Base64 text, whose alphabet excludes commas.
        Map<String, List<String>> withComma = decodeDartDefines(
            defines(['APP_ENV=staging', 'OTHER=a,b,c']))
        assert withComma['OTHER'] == ['a,b,c']
        assert withComma['APP_ENV'] == ['staging']
        logger.lifecycle('  ok  a value containing "," is preserved')

        assert decodeDartDefines(null).isEmpty()
        assert decodeDartDefines('').isEmpty()
        logger.lifecycle('  ok  absent defines decode to an empty map')

        // `--dart-define-from-file` is not a second channel: Flutter merges file
        // entries into the same `dart-defines` property, so a define's origin is
        // invisible here. Equivalence means identical text decodes identically
        // however the two halves were assembled...
        List<String> fromFile = ['APP_ENV=production', 'DATA_SOURCE=remote']
        List<String> fromFlags = ['API_BASE_URL=https://example.invalid']
        String merged = defines(fromFile + fromFlags)
        Map<String, List<String>> mergedDecoded = decodeDartDefines(merged)
        assert mergedDecoded['APP_ENV'] == ['production']
        assert mergedDecoded['DATA_SOURCE'] == ['remote']
        assert mergedDecoded['API_BASE_URL'] == ['https://example.invalid']
        assert decodeDartDefines(defines(fromFile) + ',' + defines(fromFlags)) == mergedDecoded
        assert resolveAppEnv(merged, 'production', 'production') == 'production'
        logger.lifecycle('  ok  file-supplied and flag-supplied defines are equivalent')

        // ...and equivalence cuts both ways: a padded token from a file is
        // rejected exactly like a padded token from a flag. There is no
        // "trusted" origin.
        expectFailure('a padded token supplied through a file') {
            resolveAppEnv(
                defines(['APP_ENV=production ', 'DATA_SOURCE=remote']),
                'production', 'production')
        }

        // Exactness applies to APP_ENV alone. Other defines are never compared,
        // normalized or logged, so their spaces, commas and '=' are untouched.
        Map<String, List<String>> noisy = decodeDartDefines(
            defines([
                'APP_ENV=production',
                'OTHER=  padded on both sides  ',
                'URL=https://example.invalid/a?b=c&d=e',
                'LIST=a,b,c',
            ]))
        assert noisy['OTHER'] == ['  padded on both sides  ']
        assert noisy['URL'] == ['https://example.invalid/a?b=c&d=e']
        assert noisy['LIST'] == ['a,b,c']
        assert resolveAppEnv(
            defines([
                'APP_ENV=production',
                'OTHER=  padded on both sides  ',
                'LIST=a,b,c',
            ]),
            'production', 'production') == 'production'
        logger.lifecycle('  ok  unrelated defines keep their spaces, commas and "="')

        // A define with no key is not addressable, so it is skipped rather than
        // guessed at -- and skipping it must not disturb the rest.
        Map<String, List<String>> noSeparator = decodeDartDefines(
            defines(['APP_ENV=production', 'NOEQUALSSIGN', '=orphanvalue']))
        assert noSeparator.keySet() == ['APP_ENV'] as Set
        assert noSeparator['APP_ENV'] == ['production']
        assert resolveAppEnv(
            defines(['APP_ENV=production', 'NOEQUALSSIGN', '=orphanvalue']),
            'production', 'production') == 'production'
        logger.lifecycle('  ok  a decoded define with no "=" is skipped without side effects')

        // --- rejected -------------------------------------------------------
        expectFailure('a missing APP_ENV') {
            resolveAppEnv(defines(['DATA_SOURCE=remote']), 'production', 'production')
        }
        expectFailure('no defines at all') {
            resolveAppEnv(null, 'production', 'production')
        }
        expectFailure('an unknown APP_ENV value') {
            resolveAppEnv(defines(['APP_ENV=prod']), 'production', 'production')
        }
        expectFailure('an empty APP_ENV value') {
            resolveAppEnv(defines(['APP_ENV=']), 'production', 'production')
        }
        expectFailure('duplicate APP_ENV with different values') {
            resolveAppEnv(
                defines(['APP_ENV=production', 'APP_ENV=development']), 'production', 'production')
        }
        expectFailure('duplicate APP_ENV with identical values') {
            resolveAppEnv(
                defines(['APP_ENV=production', 'APP_ENV=production']), 'production', 'production')
        }
        expectFailure('a duplicate split across a file and a flag') {
            resolveAppEnv(
                defines(['APP_ENV=production']) + ',' + defines(['APP_ENV=production']),
                'production', 'production')
        }
        expectFailure('malformed Base64') {
            decodeDartDefines('not-valid-base64!!')
        }
        expectFailure('malformed Base64 beside a valid entry') {
            resolveAppEnv(
                defines(['APP_ENV=production']) + ',not-valid-base64!!',
                'production', 'production')
        }
        expectFailure('an undeclared flavor') {
            resolveAppEnv(defines(['APP_ENV=production']), 'mystery', null)
        }

        logger.lifecycle('APP_ENV parser: all cases behaved as specified.')
    }
}

/// Exercises the mapping-upload authorization rule against synthetic inputs.
///
/// Hermetic and deterministic: it never reads the real property and never
/// performs, prepares or schedules an upload. It tests the pure decision the
/// build makes, across every flavor, every build type and every property state,
/// so the matrix is proven without ever producing the side effect it guards.
tasks.register('verifyMappingUploadPolicy') {
    group = 'verification'
    description = 'Unit-tests the Crashlytics mapping-upload authorization rule.'

    doLast {
        // Closures rather than methods: see verifyAppEnvParser.
        def eligible = project.ext.mappingUploadEligible
        def resolve = project.ext.resolveMappingUploadOptIn

        def expectFailure = { String description, Closure body ->
            try {
                body()
            } catch (GradleException ignored) {
                logger.lifecycle("  ok  ${description}")
                return
            }
            throw new GradleException(
                "mapping-upload policy: expected a failure for ${description}")
        }

        List<String> flavors = project.android.productFlavors.collect { it.name }.sort()
        List<String> buildTypes = project.android.buildTypes.collect { it.name }.sort()

        // --- the property alone ----------------------------------------------
        assert resolve(null) == false
        assert resolve('false') == false
        assert resolve('true') == true
        logger.lifecycle('  ok  absent, "false" and "true" resolve as specified')

        for (String bad in ['', ' ', '  ', 'TRUE', 'True', 'FALSE', '1', '0',
                            'yes', 'no', ' true', 'true ', 'true\n', 'enabled']) {
            expectFailure("a present but unusable value '${bad}'") { resolve(bad) }
        }

        // --- the full eligibility matrix -------------------------------------
        int combinations = 0
        int eligibleCount = 0
        for (String raw in [null, 'false', 'true']) {
            for (String flavor in flavors) {
                for (String buildType in buildTypes) {
                    combinations++
                    boolean actual = eligible(flavor, buildType, raw)
                    boolean expected = raw == 'true' &&
                        flavor == 'production' &&
                        buildType == 'release'
                    assert actual == expected,
                        "flavor=${flavor} buildType=${buildType} property=${raw} " +
                        "resolved to ${actual}, expected ${expected}"
                    if (actual) {
                        eligibleCount++
                    }
                }
            }
        }
        assert eligibleCount == 1,
            "exactly one combination may ever be eligible, found ${eligibleCount}"
        logger.lifecycle(
            "  ok  matrix: ${combinations} combinations across " +
            "${flavors.size()} flavors x ${buildTypes.size()} build types x 3 " +
            "property states, exactly 1 eligible")

        // --- the invariants stated directly ----------------------------------
        for (String flavor in flavors) {
            for (String buildType in buildTypes) {
                assert !eligible(flavor, buildType, null),
                    "${flavor}/${buildType} is eligible with the property absent"
                assert !eligible(flavor, buildType, 'false'),
                    "${flavor}/${buildType} is eligible with the property false"
            }
        }
        logger.lifecycle('  ok  nothing is eligible while authorization is absent or false')

        for (String flavor in flavors.findAll { it != 'production' }) {
            for (String buildType in buildTypes) {
                assert !eligible(flavor, buildType, 'true'),
                    "${flavor} became eligible under explicit authorization"
            }
        }
        logger.lifecycle('  ok  dev and staging can never become eligible')

        for (String buildType in buildTypes.findAll { it != 'release' }) {
            for (String flavor in flavors) {
                assert !eligible(flavor, buildType, 'true'),
                    "${buildType} became eligible under explicit authorization"
            }
        }
        logger.lifecycle('  ok  debug and profile can never become eligible')

        assert eligible('production', 'release', 'true')
        logger.lifecycle('  ok  production release is eligible only with explicit authorization')

        logger.lifecycle('Mapping-upload policy: all cases behaved as specified.')
    }
}

/// Asserts the plugin/task policy from the configured Gradle model.
tasks.register('verifyAndroidBuildPolicy') {
    group = 'verification'
    description = 'Asserts the Firebase plugin, task and environment-gate policy.'

    doLast {
        List<String> failures = []

        // A closure, not a method: see verifyAppEnvParser above.
        def require = { List<String> sink, boolean condition, String message ->
            if (!condition) sink.add(message)
        }

        // The real property, as this invocation sees it. Absent in every local
        // build and every current CI job, which is the state this task exists to
        // hold in place.
        String uploadRaw = project.findProperty('gridviewCrashlyticsUploadMapping')?.toString()
        if (uploadRaw == null) {
            logger.lifecycle(
                '  gridviewCrashlyticsUploadMapping is absent: no variant may upload a mapping file.')
        } else {
            logger.lifecycle(
                "  gridviewCrashlyticsUploadMapping='${uploadRaw}': production release only.")
        }

        // 1. All three plugins are applied during normal configuration — not
        //    conditionally on which task someone typed.
        [
            'com.google.gms.google-services',
            'com.google.firebase.crashlytics',
            'com.google.firebase.firebase-perf',
        ].each { String id ->
            require(failures, project.plugins.hasPlugin(id), "plugin not applied: ${id}")
        }

        project.android.applicationVariants.all { variant ->
            String name = variant.name
            String capitalized = name.capitalize()
            boolean isProduction = variant.flavorName == 'production'

            // 2/3. Google Services processing: enabled for production, disabled
            //      for every other flavor (they own no configuration file).
            def googleServices = project.tasks.findByName("process${capitalized}GoogleServices")
            require(failures, googleServices != null,
                "missing Google Services task for ${name}")
            if (googleServices != null) {
                require(failures, googleServices.enabled == isProduction,
                    "process${capitalized}GoogleServices enabled=${googleServices.enabled}, expected ${isProduction}")
            }

            // 4. Crashlytics mapping-file-ID injection exists for production.
            def mappingId = project.tasks.findByName("injectCrashlyticsMappingFileId${capitalized}")
            if (isProduction) {
                require(failures, mappingId != null,
                    "missing Crashlytics mapping-file-ID task for ${name}")
                if (mappingId != null) {
                    require(failures, mappingId.enabled,
                        "injectCrashlyticsMappingFileId${capitalized} is disabled")
                }
            }

            // 4b. Mapping-file *upload* is the one network-mutating task, so it
            //     is checked against the authorization rule rather than against
            //     the flavor alone. With no property set — every local build and
            //     every current CI job — the expectation is false everywhere,
            //     production release included.
            boolean uploadExpected = project.ext.mappingUploadEligible(
                variant.flavorName, variant.buildType.name, uploadRaw)
            def mappingUpload = project.tasks.findByName("uploadCrashlyticsMappingFile${capitalized}")
            if (mappingUpload != null) {
                require(failures, mappingUpload.enabled == uploadExpected,
                    "uploadCrashlyticsMappingFile${capitalized} enabled=${mappingUpload.enabled}, expected ${uploadExpected}")
            } else {
                require(failures, !uploadExpected,
                    "uploadCrashlyticsMappingFile${capitalized} is absent but policy expects it enabled")
            }

            // 4c. No symbol upload exists at all. `firebase-crashlytics-ndk` is
            //     deliberately absent, so C/C++ library crashes are not captured
            //     (JVM ones still are) and there is no second network-mutating
            //     Crashlytics task to gate.
            require(failures,
                project.tasks.findByName("uploadCrashlyticsSymbolFile${capitalized}") == null,
                "uploadCrashlyticsSymbolFile${capitalized} exists; the NDK dependency was reintroduced")

            // 4d. Local-only mapping *generation* stays available and ungated.
            //     Withholding upload authorization must not stop a release build
            //     from minifying and writing its mapping file locally.
            if (variant.buildType.name == 'release') {
                def minify = project.tasks.findByName("minify${capitalized}WithR8")
                require(failures, minify != null && minify.enabled,
                    "minify${capitalized}WithR8 is missing or disabled; "
                        + "release builds must still generate a mapping file locally")
            }

            // 5. Both gates are real dependencies of the variant's resource
            //    merge, so no assemble/bundle/install path reaches an artifact
            //    without them — whatever task name was requested.
            def anchor = variant.mergeResourcesProvider.get()
            List<String> anchorDeps = anchor.taskDependencies
                .getDependencies(anchor)
                .collect { it.name }
            ["validate${capitalized}Environment", "verify${capitalized}FirebaseDependencies"]
                .each { String gate ->
                    require(failures, anchorDeps.contains(gate),
                        "${gate} is not a dependency of ${anchor.name}")
                }

            // 6. The gates must NOT hang off pre<Variant>Build. AGP's native
            //    configuration tasks are keyed by build type and ABI only, and
            //    depend on every flavor's pre-build of that type, so a gate
            //    there makes one flavor's build run another flavor's validator.
            //    This caught exactly that regression once; keep it.
            def preBuild = project.tasks.findByName("pre${capitalized}Build")
            require(failures, preBuild != null, "missing pre${capitalized}Build")
            if (preBuild != null) {
                List<String> preBuildDeps = preBuild.taskDependencies
                    .getDependencies(preBuild)
                    .collect { it.name }
                require(failures,
                    !preBuildDeps.any { it.startsWith('validate') && it.endsWith('Environment') },
                    "pre${capitalized}Build depends on an environment gate; " +
                    "anchor the gates on the variant's resource merge instead")
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                'Android build policy violated:\n  ' + failures.join('\n  ') +
                '\nSee docs/technical/GridView_Observability.md.'
            )
        }
        logger.lifecycle('Android build policy: plugins, Google Services scoping, ' +
            'Crashlytics injection and environment gates all as specified.')
    }
}

// -----------------------------------------------------------------------------
// Staging backup and restore isolation.
//
// com.sejuma.gridview.staging must never back up or restore application data
// through cloud backup, device-to-device transfer or legacy Auto Backup, while
// dev and production keep exactly the platform defaults they had before. This
// reads each variant's *merged* manifest - what is actually packaged - not the
// overlay source, so a library, a new source set or a `tools:` directive that
// changes the merge result fails here too.
// -----------------------------------------------------------------------------

/// Every application-data domain Android defines for backup rules,
/// credential-protected and device-protected storage alike.
def backupDomains = [
    'root', 'file', 'database', 'sharedpref', 'external',
    'device_root', 'device_file', 'device_database', 'device_sharedpref',
] as Set

/// Manifest attribute -> the staging-only rule resource it must reference.
def stagingBackupRules = [
    fullBackupContent  : 'staging_full_backup_content',
    dataExtractionRules: 'staging_data_extraction_rules',
]

def verifyStagingBackupPolicy = tasks.register('verifyStagingBackupPolicy') {
    group = 'verification'
    description = 'Asserts staging-only backup and restore isolation from every merged manifest.'
}

// Variant name -> flavor and merged manifest, filled as AGP creates variants.
// The artifact provider carries its producing task, so declaring it as an input
// is what makes this task process every variant's manifest first.
def mergedManifests = [:]
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def manifest = variant.artifacts.get(
        com.android.build.api.artifact.SingleArtifact.MERGED_MANIFEST.INSTANCE)
    mergedManifests[variant.name] = [flavor: variant.flavorName, manifest: manifest]
    verifyStagingBackupPolicy.configure { inputs.file(manifest) }
}

verifyStagingBackupPolicy.configure {
    doLast {
        final String androidNs = 'http://schemas.android.com/apk/res/android'
        List<String> failures = []

        // Closures rather than methods: see verifyAppEnvParser.
        def require = { boolean condition, String message ->
            if (!condition) failures.add(message)
        }
        def parse = { File file ->
            def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
            factory.namespaceAware = true
            factory.newDocumentBuilder().parse(file).documentElement
        }
        def childElements = { element ->
            def nodes = element.childNodes
            (0..<nodes.length).collect { nodes.item(it) }
                .findAll { it.nodeType == org.w3c.dom.Node.ELEMENT_NODE }
        }

        Map<String, String> expectedIds = [
            dev       : 'com.sejuma.gridview.dev',
            staging   : 'com.sejuma.gridview.staging',
            production: 'com.sejuma.gridview',
        ]
        List<String> flavors = project.android.productFlavors.collect { it.name }.sort()
        require(expectedIds.keySet().sort() == flavors,
            "expected application IDs for ${expectedIds.keySet().sort()}, build declares ${flavors}")

        // Every variant the build declares, not a hand-picked few.
        int expectedVariants = flavors.size() * project.android.buildTypes.size()
        require(mergedManifests.size() == expectedVariants,
            "checked ${mergedManifests.size()} merged manifests, expected ${expectedVariants}")

        // --- merged manifests ------------------------------------------------
        mergedManifests.sort().each { String name, Map entry ->
            File file = entry.manifest.get().asFile
            def root = parse(file)
            def application = root.getElementsByTagName('application').item(0)

            String packageName = root.getAttribute('package')
            require(packageName == expectedIds[entry.flavor],
                "${name}: package ${packageName}, expected ${expectedIds[entry.flavor]}")
            require(!application.hasAttributeNS(androidNs, 'backupAgent'),
                "${name}: declares android:backupAgent")

            if (entry.flavor == 'staging') {
                require(application.getAttributeNS(androidNs, 'allowBackup') == 'false',
                    "${name}: android:allowBackup is not false")
                stagingBackupRules.each { String attribute, String resource ->
                    String actual = application.getAttributeNS(androidNs, attribute)
                    require(actual == "@xml/${resource}".toString(),
                        "${name}: android:${attribute}='${actual}', expected @xml/${resource}")
                }
            } else {
                // Unchanged means no backup attribute at all: the platform
                // defaults apply exactly as they did before this policy.
                ['allowBackup', 'fullBackupContent', 'dataExtractionRules'].each { String attribute ->
                    require(!application.hasAttributeNS(androidNs, attribute),
                        "${name}: android:${attribute} is set; ${entry.flavor} keeps the platform defaults")
                }
                String text = file.getText('UTF-8')
                stagingBackupRules.values().each { String resource ->
                    require(!text.contains(resource),
                        "${name}: references the staging-only resource ${resource}")
                }
            }
            logger.lifecycle("  checked ${name} (${packageName})")
        }

        // --- the rule resources ----------------------------------------------
        //
        // Each must be defined exactly once, in the staging source set's plain
        // `xml` directory. A copy elsewhere would either leak into dev or
        // production, or silently override the rules for one staging build
        // type or API level (`stagingRelease`, `xml-v31`).
        stagingBackupRules.values().each { String resource ->
            List<List> definitions = project.android.sourceSets.collectMany { sourceSet ->
                sourceSet.res.srcDirs.collectMany { File resDir ->
                    (resDir.listFiles() ?: [])
                        .findAll { it.isDirectory() && (it.name == 'xml' || it.name.startsWith('xml-')) }
                        .collect { new File(it, "${resource}.xml") }
                        .findAll { it.isFile() }
                        .collect { [sourceSet.name, it] }
                }
            }
            require(definitions.size() == 1 &&
                definitions[0][0] == 'staging' &&
                definitions[0][1].parentFile.name == 'xml',
                "${resource}.xml must be defined once, in the staging source set's xml/ " +
                "directory; found ${definitions.collect { "${it[0]}:${it[1].parentFile.name}" }}")
            if (definitions.isEmpty()) {
                return
            }

            def rules = parse(definitions[0][1])
            require(rules.getElementsByTagName('include').length == 0,
                "${resource}: declares an include rule")

            // Each section may hold exclude rules only, each covering a whole
            // domain, and together they must cover every domain.
            def excludesEveryDomain = { section, String where ->
                Set<String> domains = [] as Set
                childElements(section).each { rule ->
                    require(rule.tagName == 'exclude', "${where}: unexpected <${rule.tagName}>")
                    require(rule.getAttribute('path') == '.',
                        "${where}: the ${rule.getAttribute('domain')} exclusion is not the whole domain")
                    domains.add(rule.getAttribute('domain'))
                }
                require(domains == backupDomains,
                    "${where}: excludes ${domains.sort()}, expected ${backupDomains.sort()}")
            }

            if (resource == stagingBackupRules.fullBackupContent) {
                require(rules.tagName == 'full-backup-content',
                    "${resource}: root is <${rules.tagName}>")
                excludesEveryDomain(rules, resource)
            } else {
                require(rules.tagName == 'data-extraction-rules',
                    "${resource}: root is <${rules.tagName}>")
                def sections = childElements(rules)
                require(sections.collect { it.tagName }.sort() == ['cloud-backup', 'device-transfer'],
                    "${resource}: sections ${sections.collect { it.tagName }}, " +
                    "expected exactly cloud-backup and device-transfer")
                sections.each { excludesEveryDomain(it, "${resource}/${it.tagName}") }
            }
            logger.lifecycle("  checked ${resource}.xml")
        }

        if (!failures.isEmpty()) {
            throw new GradleException(
                'Staging backup policy violated:\n  ' + failures.join('\n  ') +
                '\nSee docs/technical/GridView_Environments.md.'
            )
        }
        logger.lifecycle('Staging backup policy: staging excludes all data from backup and ' +
            'transfer; dev and production keep the platform defaults.')
    }
}
